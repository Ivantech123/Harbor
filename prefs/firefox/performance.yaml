# See upstream issue #11599, this pref seems to
# have disabled itself on macos for some unknown reason.
# Make sure its in sync with:
# https://searchfox.org/firefox-main/rev/dd2579cb6e7f1761a27ce64fb84d92c61d85c27f/modules/libpref/init/StaticPrefList.yaml#8396
- name: gfx.webrender.compositor
  condition: "defined(XP_WIN) || defined(XP_DARWIN) || defined(MOZ_WIDGET_GTK)"
  value: "@cond"
  mirror: once

# Don't keep empty content processes warm. Each one is a full browser process.
- name: dom.ipc.processPrelaunch.enabled
  value: false

- name: dom.ipc.processPrelaunch.fission.number
  value: 0

# Ordinary sites share a small pool. Sites with a saved login, and pages that
# ask for cross-origin isolation, still get their own process.
# 2 = IsolateHighValue. 1 (the Firefox default) is one process per site.
- name: fission.webContentIsolationStrategy
  value: 2

- name: dom.ipc.processCount
  value: 4

# One process for an isolated site, not four.
- name: dom.ipc.processCount.webIsolated
  value: 1

# A few fully painted pages stay ready for Back, so returning does not
# flash a reload. -1 grows this with the amount of RAM.
- name: browser.sessionhistory.max_total_viewers
  value: 4

- name: browser.sessionhistory.max_entries
  value: 20

# Network cache cap in KB. Decoded pictures stay on Firefox's own limit
# so scrolling does not throw images away and draw them again.
- name: browser.cache.memory.capacity
  value: 65536

# Form data kept in the session per site, in bytes. The default is 50 MB.
- name: browser.sessionstore.dom_form_max_limit
  value: 1048576

# Write the session less often while the window is in use.
- name: browser.sessionstore.interval
  value: 60000

# Don't resolve and fetch the next page before it is opened.
- name: network.dns.disablePrefetch
  value: true

- name: network.prefetch-next
  value: false

# No spare connections opened before a click.
- name: network.http.speculative-parallel-limit
  value: 0

# Drop the about: page process once you leave it.
- name: dom.ipc.keepProcessesAlive.privilegedabout
  value: 0

# Closed-tab undo list. The open tabs look the same.
- name: browser.sessionstore.max_tabs_undo
  value: 5
