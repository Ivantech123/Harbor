# The share server, see services/share-server. Sharing is off while this
# is empty.
- name: harbor.share.base-url
  value: ""

# Has to be one of the server's API_KEYS.
- name: harbor.share.api-key
  value: "harbor-desktop"

- name: harbor.share.secret-key
  value: ""

- name: harbor.share.display-name
  value: ""

# Allow harbor.share.display-name to be synced across devices.
- name: services.sync.prefs.sync.harbor.share.display-name
  value: true

- name: harbor.share.dont-ask-before-sharing
  value: false
