- name: harbor.mods.updated-value-observer
  value: false

- name: harbor.mods.auto-update-days
  value: 20 # In days

- name: harbor.mods.auto-update
  value: "@cond"
  condition: "defined(MOZILLA_OFFICIAL)"

# === Mark: Mod store ===

# Empty means the store shipped inside the browser. Set it to an HTTPS
# URL to use a remote store with the same layout (see src/harbor/mods/store).
- name: harbor.mods.store-url
  value: ""

# === Mark: Site Injection ===

# Sites that get the mod install API injected, comma separated. The store
# is a built-in page, so no site needs it.
- name: harbor.injections.match-urls
  value: ""
  locked: true
