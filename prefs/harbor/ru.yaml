# Russian-market defaults. Region stays RU, so Firefox's search list
# picks Yandex instead of following an IP lookup.

- name: browser.search.region
  value: "RU"
  locked: true

- name: browser.search.geoip.url
  value: ""
  locked: true

- name: intl.locale.requested
  value: "ru"

- name: intl.accept_languages
  value: "ru-RU, ru, en-US, en"

- name: spellchecker.dictionary
  value: "ru"
