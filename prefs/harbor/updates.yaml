# --- Harbor GitHub updater stub ---
# Release links point at the Ivantech123/Harbor GitHub repo.
# Auto-update stays off until updateHostname + MAR pipeline are live.

- name: harbor.updates.show-update-notification
  value: false

- name: harbor.updates.github.repo
  value: "Ivantech123/Harbor"

- name: harbor.updates.github.releases
  value: "https://github.com/Ivantech123/Harbor/releases"

- name: harbor.updates.github.latest
  value: "https://github.com/Ivantech123/Harbor/releases/latest"

# Manual / details links (also set in branding prefs; kept here for overrides)
- name: app.update.url.manual
  value: "https://github.com/Ivantech123/Harbor/releases/latest"

- name: app.update.url.details
  value: "https://github.com/Ivantech123/Harbor/releases"

- name: app.releaseNotesURL
  value: "https://github.com/Ivantech123/Harbor/releases"

- name: app.releaseNotesURL.aboutDialog
  value: "https://github.com/Ivantech123/Harbor/releases/tag/%VERSION%"

- name: app.releaseNotesURL.prompt
  value: "https://github.com/Ivantech123/Harbor/releases/tag/%VERSION%"

# Do not hit a foreign AUS. Re-enable when GitHub/Pages (or custom host) serves update.xml.
- name: app.update.enabled
  value: false

- name: app.update.auto
  value: false
