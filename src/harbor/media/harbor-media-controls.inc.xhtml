<toolbar id="harbor-media-controls-toolbar"
  class="browser-toolbar customization-target harbor-sidebar-toolbar"
  context="toolbar-context-menu"
  mode="icons"
  fullscreentoolbar="true"
  hidden="true">
  <html:template id="harbor-media-card-template">
    <toolbaritem class="harbor-media-card">
      <vbox class="harbor-media-main-vbox">
        <vbox>
          <hbox class="harbor-media-info-container show-on-hover">
            <vbox class="harbor-media-info-vbox">
              <label class="harbor-media-title" fadein="true"/>
              <label class="harbor-media-artist" fadein="true"/>
            </vbox>
            <hbox class="harbor-media-buttons-hbox">
              <toolbarbutton class="harbor-media-pip-button toolbarbutton-1" />
              <toolbarbutton class="harbor-media-close-button toolbarbutton-1" />
            </hbox>
          </hbox>
          <hbox class="harbor-media-progress-hbox show-on-hover">
            <label class="harbor-media-current-time">0:00</label>
            <html:input type="range" class="harbor-media-progress-bar"
              value="0" min="0" max="100" step="0.1"/>
            <label class="harbor-media-duration">0:00</label>
          </hbox>
        </vbox>
        <hbox class="harbor-media-controls-hbox">
          <toolbarbutton class="harbor-media-focus-button toolbarbutton-1" />
          <hbox class="harbor-media-playback-buttons">
            <toolbarbutton class="harbor-media-previoustrack-button toolbarbutton-1" />
            <toolbarbutton class="harbor-media-playpause-button toolbarbutton-1" />
            <toolbarbutton class="harbor-media-nexttrack-button toolbarbutton-1" />
          </hbox>
          <toolbarbutton class="harbor-media-mute-button toolbarbutton-1" />
          <hbox class="media-device-buttons">
            <toolbarbutton class="harbor-media-mute-mic-button toolbarbutton-1" />
            <toolbarbutton class="harbor-media-mute-camera-button toolbarbutton-1" />
          </hbox>
        </hbox>
      </vbox>
    </toolbaritem>
  </html:template>
</toolbar>
