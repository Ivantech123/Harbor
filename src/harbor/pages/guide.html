<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src chrome:; img-src chrome: data:; object-src 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-l10n-id="harbor-page-guide-title"></title>
    <link rel="icon" href="chrome://branding/content/icon32.png" />
    <link rel="localization" href="branding/brand.ftl" />
    <link rel="localization" href="browser/harbor-pages.ftl" />
    <link
      rel="stylesheet"
      href="chrome://browser/content/harbor-pages/harbor-pages.css"
    />
  </head>
  <body>
    <main>
      <header class="harbor-page-hero">
        <img src="chrome://branding/content/about-logo.png" alt="" />
        <div>
          <h1 data-l10n-id="harbor-page-guide-heading"></h1>
          <p data-l10n-id="harbor-page-guide-subheading"></p>
        </div>
      </header>

      <section class="harbor-page-section" id="spaces">
        <h2 data-l10n-id="harbor-page-feature-spaces"></h2>
        <p data-l10n-id="harbor-page-feature-spaces-long"></p>
      </section>
      <section class="harbor-page-section" id="essentials">
        <h2 data-l10n-id="harbor-page-feature-essentials"></h2>
        <p data-l10n-id="harbor-page-feature-essentials-long"></p>
      </section>
      <section class="harbor-page-section" id="split-view">
        <h2 data-l10n-id="harbor-page-feature-split-view"></h2>
        <p data-l10n-id="harbor-page-feature-split-view-long"></p>
      </section>
      <section class="harbor-page-section" id="glance">
        <h2 data-l10n-id="harbor-page-feature-glance"></h2>
        <p data-l10n-id="harbor-page-feature-glance-long"></p>
      </section>
      <section class="harbor-page-section" id="compact-mode">
        <h2 data-l10n-id="harbor-page-feature-compact-mode"></h2>
        <p data-l10n-id="harbor-page-feature-compact-mode-long"></p>
      </section>
      <section class="harbor-page-section" id="window-sync">
        <h2 data-l10n-id="harbor-page-feature-window-sync"></h2>
        <p data-l10n-id="harbor-page-feature-window-sync-long"></p>
      </section>
      <section class="harbor-page-section" id="mods">
        <h2 data-l10n-id="harbor-page-feature-mods"></h2>
        <p data-l10n-id="harbor-page-feature-mods-long"></p>
        <a
          class="harbor-page-button"
          href="chrome://browser/content/harbor-pages/mods.html"
          data-l10n-id="harbor-page-welcome-open-mods"
        ></a>
      </section>
      <section class="harbor-page-section" id="share">
        <h2 data-l10n-id="harbor-page-feature-share"></h2>
        <p data-l10n-id="harbor-page-feature-share-long"></p>
      </section>
      <section class="harbor-page-section" id="direct">
        <h2 data-l10n-id="harbor-page-feature-direct"></h2>
        <p data-l10n-id="harbor-page-feature-direct-long"></p>
      </section>

      <nav class="harbor-page-footer">
        <a
          href="chrome://browser/content/harbor-pages/welcome.html"
          data-l10n-id="harbor-page-back-to-welcome"
        ></a>
      </nav>
    </main>
  </body>
</html>
