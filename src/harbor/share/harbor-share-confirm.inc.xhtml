<!DOCTYPE window>

<window
  xmlns:html="http://www.w3.org/1999/xhtml"
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  id="harborShareConfirmDialog"
>
  <dialog
    buttons="accept,cancel"
    data-l10n-id="harbor-share-confirm-dialog"
    data-l10n-attrs="buttonlabelaccept"
  >
    <linkset>
      <html:link
        rel="stylesheet"
        href="chrome://global/skin/global.css"
        type="text/css"
      />
      <html:link
        rel="stylesheet"
        href="chrome://browser/content/harbor-styles/harbor-theme.css"
        type="text/css"
      />
      <html:link rel="localization" href="browser/harbor-share.ftl" />
    </linkset>

    <script src="chrome://browser/content/harbor-components/windows/harbor-share-confirm.js"></script>

    <vbox style="padding-inline: 12px;">
      <html:h2
        data-l10n-id="harbor-share-confirm-title"
      ></html:h2>
      <description data-l10n-id="harbor-share-confirm-description" />
      <description
        style="margin: 12px 0 16px;"
        data-l10n-id="harbor-share-confirm-anonymous"
      />
      <html:input
        style="margin-bottom: 12px;"
        id="harbor-share-confirm-name"
        type="text"
        maxlength="200"
        data-l10n-id="harbor-share-confirm-name-input"
      />
      <checkbox
        id="harbor-share-confirm-dont-ask"
        data-l10n-id="harbor-share-confirm-dont-ask"
      />
    </vbox>
  </dialog>
</window>
